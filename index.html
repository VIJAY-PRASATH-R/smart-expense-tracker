<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Smart Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>🔐 Smart Expense Tracker</h1>
      <div>
        <select id="themeSelect" class="btn secondary">
          <option value="">🌙 Dark</option>
          <option value="light-mode">☀️ Light</option>
          <option value="purple-mode">💜 Purple</option>
          <option value="orange-mode">🟧 Orange</option>
          <option value="teal-mode">🟩 Teal</option>
        </select>
      </div>
    </div>

    <h2 style="text-align:center;">Login / Register</h2>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <button type="submit" class="btn primary">Login</button>
      <button type="button" id="registerBtn" class="btn secondary">Register</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const USERS_KEY = "users";
      const SESSION_KEY = "sessionUser";
      let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];

      document.getElementById("loginForm").addEventListener("submit", e => {
        e.preventDefault();
        const uname = document.getElementById("username").value.trim();
        const pwd = document.getElementById("password").value.trim();

        // 🔐 Admin check from localStorage
        const adminCreds = JSON.parse(localStorage.getItem("adminCreds") || "null");
        if (adminCreds && uname === adminCreds.username && pwd === adminCreds.password) {
          localStorage.setItem(SESSION_KEY, uname);
          window.location.href = "admin.html";
          return;
        }

        // Normal user login
        const user = users.find(u => u.username === uname && u.password === pwd);
        if (user) {
          localStorage.setItem(SESSION_KEY, uname);
          window.location.href = "dashboard.html";
        } else {
          alert("Invalid credentials. Please register.");
        }
      });

      // Register normal users
      document.getElementById("registerBtn").addEventListener("click", () => {
        const uname = document.getElementById("username").value.trim();
        const pwd = document.getElementById("password").value.trim();
        if (!uname || !pwd) return alert("Enter username and password.");

        // Prevent registering as current admin username
        const adminCreds = JSON.parse(localStorage.getItem("adminCreds") || "null");
        if (adminCreds && uname === adminCreds.username) {
          return alert("This username is reserved for admin.");
        }

        if (users.some(u => u.username === uname)) return alert("User already exists.");
        users.push({ username: uname, password: pwd });
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
        alert("Registered successfully. Please login.");
      });
    });
  </script>
  <script src="theme.js"></script>
</body>
</html>
